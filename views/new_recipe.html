{% extends "base.html" %}
{% block title %}
  Add New Recipe - Recipe Site
{% endblock title %}
{% block head_extra %}
  <script>
    let ingredientsChecked = false;

    function addIngredientField() {
      const container = document.getElementById('ingredients');
      const div = document.createElement('div');
      div.className = 'flex gap-2 mb-2 relative';
      const index = container.children.length;
      div.innerHTML = `
        <div class="w-full relative">
          <input type="text" name="ingredient" placeholder="Ingredient" class="ingredient-input w-full p-2 border rounded" oninput="disableSubmit(); hideSuggestions(${index})" data-index="${index}" />
          <div class="autocomplete bg-white border border-gray-300 rounded absolute w-full z-10 hidden max-h-40 overflow-y-auto" id="suggestions-${index}"></div>
        </div>
        <input type="text" name="amount" placeholder="Amount" class="w-1/3 p-2 border rounded" oninput="disableSubmit()" />
      `;
      container.appendChild(div);
      disableSubmit();
    }

    function hideSuggestions(index) {
      const suggBox = document.getElementById(`suggestions-${index}`);
      if (suggBox) suggBox.classList.add('hidden');
    }

    function checkIngredients() {
      const ingredientEls = document.querySelectorAll('input[name="ingredient"]');
      const amountEls = document.querySelectorAll('input[name="amount"]');
      const ingredients = [];
      let valid = true;
      for (let i = 0; i < ingredientEls.length; i++) {
        const name = ingredientEls[i].value.trim();
        const amount = amountEls[i].value.trim();
        if (!name || !amount) {
          valid = false;
          break;
        }
        ingredients.push({ name, amount });
      }

      if (!valid) {
        ingredientsChecked = false;
        document.getElementById('submit-btn').disabled = true;
        return;
      }

      const body = JSON.stringify({ ingredients });
      fetch('/check-ingredients', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body
      }).then(response => response.json())
        .then(data => {
          if (Array.isArray(data)) {
            for (let i = 0; i < data.length && i < ingredientEls.length; i++) {
              const field = ingredientEls[i];
              const suggestionsBox = document.getElementById(`suggestions-${i}`);
              if (data[i] && data[i].name) {
                const suggestions = Array.isArray(data[i].name) ? data[i].name : [data[i].name];
                if (suggestions.length === 1) {
                  field.value = suggestions[0];
                  hideSuggestions(i);
                } else {
                  suggestionsBox.innerHTML = '';
                  suggestions.forEach(s => {
                    const item = document.createElement('div');
                    item.textContent = s;
                    item.className = 'cursor-pointer p-2 hover:bg-gray-100';
                    item.onclick = () => {
                      field.value = s;
                      hideSuggestions(i);
                      disableSubmit();
                    };
                    suggestionsBox.appendChild(item);
                  });
                  suggestionsBox.classList.remove('hidden');
                }
              }
            }
            ingredientsChecked = true;
            document.getElementById('submit-btn').disabled = false;
          } else {
            ingredientsChecked = false;
            document.getElementById('submit-btn').disabled = true;
          }
        }).catch(() => {
          ingredientsChecked = false;
          document.getElementById('submit-btn').disabled = true;
        });
    }

    function disableSubmit() {
      ingredientsChecked = false;
      document.getElementById('submit-btn').disabled = true;
    }

    function handleSubmit(e) {
      if (!ingredientsChecked) {
        console.error('Ingredients not checked or invalid');
        return;
      }
        const recipeName = document.getElementById('recipe_name').value.trim();
      if (!recipeName) {
        alert("Recipe name is required");
        return;
      }
      e.preventDefault();
      const ingredientEls = document.querySelectorAll('input[name="ingredient"]');
      const amountEls = document.querySelectorAll('input[name="amount"]');
      const ingredients = [];
      for (let i = 0; i < ingredientEls.length; i++) {
        if (ingredientEls[i].value.trim()) {
          ingredients.push({
            name: ingredientEls[i].value.trim(),
            amount: amountEls[i].value.trim()
          });
        }
      }
      const body = JSON.stringify({
        recipe_name: recipeName,
        ingredients: ingredients
      });
      fetch('new_recipe', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body
      }).then(response => {
      if (response.ok) {
        window.location.href = '/new_recipe';
        alert('Recipe saved successfully!');
      } else {
        alert('Failed to save recipe');
      }
    })
    .catch(error => {
      console.error('Error:', error);
      alert('An error occurred while saving the recipe');
    });
    }
    function clearForm() {
      // Clear recipe name
      document.getElementById('recipe_name').value = '';
      
      // Clear all ingredient fields
      const ingredientContainer = document.getElementById('ingredients');
      
      // Keep the first ingredient field but clear its values
      const firstIngredientField = ingredientContainer.firstElementChild;
      if (firstIngredientField) {
        const ingredientInput = firstIngredientField.querySelector('input[name="ingredient"]');
        const amountInput = firstIngredientField.querySelector('input[name="amount"]');
        if (ingredientInput) ingredientInput.value = '';
        if (amountInput) amountInput.value = '';
      }
      
      // Remove all additional ingredient fields
      while (ingredientContainer.children.length > 1) {
        ingredientContainer.removeChild(ingredientContainer.lastChild);
      }
      
      // Reset the checked state
      ingredientsChecked = false;
      
      // Disable the submit button
      document.getElementById('submit-btn').disabled = true;
    }
  </script>
{% endblock head_extra %}
{% block content %}
  <div class="w-full max-w-xl bg-white shadow-lg rounded-2xl p-6 mt-4 mx-auto">
    <h1 class="text-2xl font-bold mb-4">Add New Recipe</h1>
    <form onsubmit="handleSubmit(event)">
      <div class="mb-4">
        <label for="recipe_name"
               class="block text-sm font-medium text-gray-700 mb-1">Recipe Name</label>
        <input type="text"
               id="recipe_name"
               name="recipe_name"
               required
               class="w-full p-2 border rounded"
               oninput="disableSubmit()">
      </div>
      <h2 class="text-xl font-semibold mb-2">Ingredients</h2>
      <div id="ingredients">
        <div class="flex gap-2 mb-2 relative">
          <div class="w-full relative">
            <input type="text"
                   name="ingredient"
                   placeholder="Ingredient"
                   class="ingredient-input w-full p-2 border rounded"
                   oninput="disableSubmit(); hideSuggestions(0)"
                   data-index="0" />
            <div class="autocomplete bg-white border border-gray-300 rounded absolute w-full z-10 hidden max-h-40 overflow-y-auto"
                 id="suggestions-0"></div>
          </div>
          <input type="text"
                 name="amount"
                 placeholder="Amount"
                 class="w-1/3 p-2 border rounded"
                 oninput="disableSubmit()" />
        </div>
      </div>
      <div class="flex justify-center space-x-2 my-4">
        <button type="button"
                onclick="addIngredientField()"
                class="mb-2 px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">+ Add Ingredient</button>
        <button type="button"
                onclick="checkIngredients()"
                class="mb-2 px-4 py-2 bg-yellow-500 text-white rounded hover:bg-yellow-600">Check Ingredients</button>
      </div>
      <div class="flex justify-center space-x-2">
        <button id="submit-btn"
                type="submit"
                class="px-6 py-2 bg-green-500 text-white rounded hover:bg-green-600 cursor-pointer ">
          Submit Recipe
        </button>
        <button type="button"
                onclick="clearForm()"
                class="ml-2 px-6 py-2 bg-red-500 text-white rounded hover:bg-red-600 cursor-pointer">
          Clear Form
        </button>
      </div>
    </form>
  </div>
{% endblock content %}
