{% extends "base.html" %}
{% block title %}
  Add New Recipe - Recipe Site
{% endblock title %}
{% block head_extra %}
  <script>
    // ... (addIngredientField, removeIngredientField, updateAllIngredientRowIndices, hideSuggestions, handleIngredientInput, updateSubmitButtonState remain mostly the same) ...
    // Ensure these functions are present from your previous version.

    function addIngredientField() {
      const container = document.getElementById('ingredients');
      const index = container.children.length; 
      const div = document.createElement('div');
      div.className = 'ingredient-row flex gap-2 mb-2 relative items-center'; 
      div.innerHTML = `
        <div class="w-full relative">
          <input type="text" name="ingredient" placeholder="Ingredient" class="ingredient-input w-full p-2 border rounded" oninput="handleIngredientInput(this, ${index})" data-index="${index}" />
          <div class="autocomplete bg-white border border-gray-300 rounded absolute w-full z-10 hidden max-h-40 overflow-y-auto" id="suggestions-${index}"></div>
        </div>
        <input type="text" name="amount" placeholder="Amount (g)" class="w-1/3 p-2 border rounded" oninput="updateSubmitButtonState()" />
        <button type="button" onclick="removeIngredientField(this)" class="ml-2 px-3 py-1 bg-red-500 text-white rounded hover:bg-red-600 text-xs">Remove</button>
      `;
      container.appendChild(div);
      const newIngredientInput = div.querySelector('input[name="ingredient"]');
      newIngredientInput.oninput = () => handleIngredientInput(newIngredientInput, index);
      
      const newAmountInput = div.querySelector('input[name="amount"]');
      newAmountInput.oninput = updateSubmitButtonState;

      updateSubmitButtonState(); 
    }

    function removeIngredientField(buttonElement) {
      const ingredientRow = buttonElement.closest('.ingredient-row');
      if (ingredientRow) {
        ingredientRow.remove();
        updateAllIngredientRowIndices();
        updateSubmitButtonState();
      }
    }

    function updateAllIngredientRowIndices() {
      const container = document.getElementById('ingredients');
      const rows = container.querySelectorAll('.ingredient-row');
      rows.forEach((row, newIndex) => {
        const ingredientInput = row.querySelector('input[name="ingredient"]');
        const suggestionsBox = row.querySelector('.autocomplete');
        
        if (ingredientInput) {
          ingredientInput.dataset.index = newIndex;
          ingredientInput.oninput = () => handleIngredientInput(ingredientInput, newIndex);
        }
        if (suggestionsBox) {
          suggestionsBox.id = `suggestions-${newIndex}`;
        }
      });
    }

    function hideSuggestions(index) {
      const suggBox = document.getElementById(`suggestions-${index}`);
      if (suggBox) {
        suggBox.innerHTML = '';
        suggBox.classList.add('hidden');
      }
    }

    function handleIngredientInput(inputElement, index) {
      const ingredientName = inputElement.value.trim();
      const suggestionsBox = document.getElementById(`suggestions-${index}`);
      
      hideSuggestions(index);

      if (!ingredientName) {
        updateSubmitButtonState();
        return;
      }

      fetch('/check-ingredients', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ingredients: [{ name: ingredientName, amount: '' }] }) 
      })
      .then(response => response.json())
      .then(data => {
        if (Array.isArray(data) && data.length > 0 && data[0] && data[0].name) {
          const suggestions = Array.isArray(data[0].name) ? data[0].name : [data[0].name];
          if (suggestions.length > 0 && !(suggestions.length === 1 && suggestions[0] === "")) {
            suggestions.forEach(s => {
              if (s && s.trim() !== "") {
                const item = document.createElement('div');
                item.textContent = s;
                item.className = 'cursor-pointer p-2 hover:bg-gray-100';
                item.onclick = () => {
                  inputElement.value = s;
                  hideSuggestions(index);
                  updateSubmitButtonState();
                };
                suggestionsBox.appendChild(item);
              }
            });
            if (suggestionsBox.children.length > 0) {
                 suggestionsBox.classList.remove('hidden');
            }
          }
        }
      })
      .catch(error => console.error('Error fetching suggestions:', error));
      
      updateSubmitButtonState();
    }

    function updateSubmitButtonState() {
      const recipeNameInput = document.getElementById('recipe_name');
      const recipeName = recipeNameInput ? recipeNameInput.value.trim() : "";
      const ingredientEls = document.querySelectorAll('input[name="ingredient"]');
      let allFieldsValid = !!recipeName; 
      let missingInfo = [];

      if (!recipeName) {
        missingInfo.push("Recipe name is missing");
      }

      if (ingredientEls.length === 0) { 
        allFieldsValid = false; 
        missingInfo.push("At least one ingredient is required");
      } else {
        for (let i = 0; i < ingredientEls.length; i++) {
          const ingredientName = ingredientEls[i].value.trim();
          const amountInput = ingredientEls[i].closest('.ingredient-row').querySelector('input[name="amount"]');
          const amount = amountInput ? amountInput.value.trim() : "";
          if (!ingredientName || !amount) {
            allFieldsValid = false;
            if (!ingredientName) missingInfo.push(`Ingredient name for item ${i+1} is missing`);
            if (!amount) missingInfo.push(`Amount for ingredient item ${i+1} is missing`);
          }
        }
      }
      
      const submitBtn = document.getElementById('submit-btn');
      if (submitBtn) {
        submitBtn.disabled = !allFieldsValid;
        if (!allFieldsValid) {
          submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
          submitBtn.classList.remove('hover:bg-green-600');
          if (missingInfo.length > 0) {
            submitBtn.title = "Please fix: " + missingInfo.join(', ') + ".";
          } else {
            submitBtn.title = "Fill in Recipe Name & at least one Ingredient (Name & Amount).";
          }
        } else {
          submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
          submitBtn.classList.add('hover:bg-green-600');
          submitBtn.title = 'Submit your recipe';
        }
      }
    }

    function displaySavedRecipeDetails(recipeDetails) {
        document.getElementById('recipe-form-section').classList.add('hidden');
        const detailsSection = document.getElementById('recipe-details-display');
        detailsSection.classList.remove('hidden');

        document.getElementById('success-message').textContent = "Recipe Saved Successfully!";
        document.getElementById('displayed-recipe-name').textContent = recipeDetails.recipe_name;
        document.getElementById('displayed-recipe-author').textContent = `By: ${recipeDetails.author}`;
        
        const ingredientsList = document.getElementById('displayed-ingredients-list');
        ingredientsList.innerHTML = ''; // Clear previous
        recipeDetails.ingredients.forEach(ing => {
            const li = document.createElement('li');
            li.className = 'text-gray-700';
            li.textContent = `${ing.name}: ${ing.amount} ${ing.unit || 'g'} (CO₂: ${ing.co2_emission_per_ingredient} kg)`;
            ingredientsList.appendChild(li);
        });

        document.getElementById('displayed-total-co2').textContent = `${recipeDetails.total_co2_emission} kg CO₂e`;
    }

    function showRecipeForm() {
        document.getElementById('recipe-details-display').classList.add('hidden');
        document.getElementById('recipe-form-section').classList.remove('hidden');
        clearForm(); // Clear the form when showing it again
    }
    
    document.addEventListener('DOMContentLoaded', () => {
        const recipeNameInput = document.getElementById('recipe_name');
        if (recipeNameInput) {
            recipeNameInput.oninput = updateSubmitButtonState;
        }
        const firstIngredientRowDiv = document.getElementById('ingredients').querySelector('.ingredient-row');
        if (firstIngredientRowDiv) {
            const firstIngredientInput = firstIngredientRowDiv.querySelector('input[name="ingredient"][data-index="0"]');
            if (firstIngredientInput) {
                firstIngredientInput.oninput = () => handleIngredientInput(firstIngredientInput, 0);
            }
            const firstAmountInput = firstIngredientRowDiv.querySelector('input[name="amount"]');
            if (firstAmountInput) {
                firstAmountInput.oninput = updateSubmitButtonState;
            }
        }
        updateAllIngredientRowIndices(); 
        updateSubmitButtonState(); 
    });

    function handleSubmit(e) {
      e.preventDefault(); 
      updateSubmitButtonState();
      if (document.getElementById('submit-btn').disabled) {
        alert(document.getElementById('submit-btn').title || "Please fill all required fields.");
        return;
      }

      const recipeName = document.getElementById('recipe_name').value.trim();
      const ingredientEls = document.querySelectorAll('input[name="ingredient"]');
      const ingredients = [];

      for (let i = 0; i < ingredientEls.length; i++) {
        const name = ingredientEls[i].value.trim();
        const amountInput = ingredientEls[i].closest('.ingredient-row').querySelector('input[name="amount"]');
        const amount = amountInput ? amountInput.value.trim() : "";
        if (name && amount) { 
          ingredients.push({ name, amount });
        } else {
            alert("All ingredient fields (name and amount) must be filled.");
            return; 
        }
      }
      if (ingredients.length === 0) {
          alert("A recipe must have at least one ingredient.");
          return;
      }
      const body = JSON.stringify({ recipe_name: recipeName, ingredients: ingredients });

      fetch('/new_recipe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body
      })
      .then(response => response.json().then(data => ({ status: response.status, body: data }))) // Parse JSON always
      .then(({ status, body }) => {
        if (status === 200 && body.recipe) { // Check for 200 OK and recipe data
          displaySavedRecipeDetails(body.recipe);
        } else {
          alert('Failed to save recipe: ' + (body.error || 'Server error or unexpected response'));
        }
      })
      .catch(error => {
        console.error('Error:', error);
        alert('An error occurred while saving the recipe.');
      });
    }

    function clearForm() {
      const recipeNameInput = document.getElementById('recipe_name');
      if (recipeNameInput) recipeNameInput.value = '';
      const ingredientContainer = document.getElementById('ingredients');
      while (ingredientContainer.children.length > 1) {
        ingredientContainer.removeChild(ingredientContainer.lastChild);
      }
      const firstIngredientDiv = ingredientContainer.querySelector('.ingredient-row');
      if (firstIngredientDiv) {
        const ingInput = firstIngredientDiv.querySelector('input[name="ingredient"]');
        const amtInput = firstIngredientDiv.querySelector('input[name="amount"]');
        if (ingInput) {
            ingInput.value = '';
            ingInput.dataset.index = 0; 
            ingInput.oninput = () => handleIngredientInput(ingInput, 0);
            hideSuggestions(0);
        }
        if (amtInput) amtInput.value = '';
        const suggestionsBox = firstIngredientDiv.querySelector('.autocomplete');
        if (suggestionsBox) suggestionsBox.id = 'suggestions-0';
      }
      updateAllIngredientRowIndices();
      updateSubmitButtonState(); 
    }
  </script>
{% endblock head_extra %}

{% block content %}
  <div id="recipe-form-section" class="w-full max-w-xl bg-white shadow-lg rounded-2xl p-6 mt-4 mx-auto">
    <h1 class="text-2xl font-bold mb-4">Add New Recipe</h1>
    <form onsubmit="handleSubmit(event)">
      <div class="mb-4">
        <label for="recipe_name" class="block text-xl font-medium text-gray-700 mb-1">Recipe Name</label>
        <input type="text" id="recipe_name" name="recipe_name" placeholder="Enter recipe name" required class="w-full p-2 border rounded">
      </div>
      <h2 class="text-xl font-semibold mb-2">Ingredients</h2>
      <div id="ingredients">
        <div class="ingredient-row flex gap-2 mb-2 relative items-center">
          <div class="w-full relative">
            <input type="text" name="ingredient" placeholder="Ingredient" class="ingredient-input w-full p-2 border rounded" data-index="0" />
            <div class="autocomplete bg-white border border-gray-300 rounded absolute w-full z-10 hidden max-h-40 overflow-y-auto" id="suggestions-0"></div>
          </div>
          <input type="text" name="amount" placeholder="Amount (g)" class="w-1/3 p-2 border rounded" />
          <button type="button" onclick="removeIngredientField(this)" class="ml-2 px-3 py-1 bg-red-500 text-white rounded hover:bg-red-600 text-xs">Remove</button>
        </div>
      </div>
      <div class="flex justify-center space-x-2 my-4">
        <button type="button" onclick="addIngredientField()" class="mb-2 px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">+ Add Ingredient</button>
      </div>
      <div class="flex justify-center space-x-2">
        <button id="submit-btn" type="submit" class="px-6 py-2 bg-green-500 text-white rounded cursor-pointer" disabled title="Fill in Recipe Name & at least one Ingredient (Name & Amount).">
          Submit Recipe
        </button>
        <button type="button" onclick="clearForm()" class="ml-2 px-6 py-2 bg-red-500 text-white rounded hover:bg-red-600 cursor-pointer">
          Clear Form
        </button>
      </div>
    </form>
  </div>

  <!-- Section to display saved recipe details (initially hidden) -->
  <div id="recipe-details-display" class="w-full max-w-xl bg-white shadow-lg rounded-2xl p-6 mt-4 mx-auto hidden">
      <h2 id="success-message" class="text-2xl font-bold text-green-600 mb-4 text-center"></h2>
      <div id="displayed-recipe-content">
          <h3 id="displayed-recipe-name" class="text-xl font-semibold text-gray-800 mb-1"></h3>
          <p id="displayed-recipe-author" class="text-sm text-gray-500 mb-4"></p>
          <h4 class="text-lg font-medium text-gray-700 mb-2">Ingredients:</h4>
          <ul id="displayed-ingredients-list" class="list-disc list-inside space-y-1 pl-4 mb-4">
              <!-- Ingredients will be injected here by JS -->
          </ul>
          <h4 class="text-lg font-medium text-gray-700 mb-2">Total Estimated CO₂ Emission:</h4>
          <p id="displayed-total-co2" class="text-lg font-semibold text-red-600 mb-4"></p>
      </div>
      <div class="text-center mt-6">
          <button type="button" onclick="showRecipeForm()" class="px-6 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">
              Add Another Recipe
          </button>
      </div>
  </div>
{% endblock content %}
