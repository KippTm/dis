{% extends "base.html" %}

{% block title %}
    Page Not Found - Recipe Site
{% endblock title %}

{% block content %}
<div class="flex flex-col items-center justify-center text-center px-4 py-16">
    <h1 class="text-6xl font-bold text-red-500 mb-4">404</h1>
    <h2 class="text-3xl font-semibold text-gray-700 mb-6">Oops! Page Not Found.</h2>
    <p class="text-gray-600 text-lg mb-8">
        Sorry, the page you are looking for does not exist, might have been removed, or is temporarily unavailable.
    </p>
    <a href="{{ url_for('main_bp.main_page') }}"
       class="px-6 py-3 bg-green-500 text-white font-semibold rounded-lg hover:bg-green-600 transition">
        Go to Homepage
    </a>
</div>
{% endblock content %}
